<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>যাত্রী</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-white"><div style="max-width:400px;margin:auto"><div style="background:#16a34a;color:white;padding:16px"><a href="index.html" style="background:rgba(255,255,255,0.2);padding:6px 10px;border-radius:50%">←</a><b> আমি যাত্রী</b></div><div style="padding:16px"><p>📍 আপনার অবস্থান</p><input id="loc" style="width:70%;border:1px solid #ccc;padding:10px;border-radius:8px" placeholder="GPS"><button onclick="navigator.geolocation.getCurrentPosition(p=>{document.getElementById('loc').value=p.coords.latitude.toFixed(5)+','+p.coords.longitude.toFixed(5)})" style="background:#16a34a;color:white;padding:10px;border-radius:8px">GPS</button><p style="margin-top:16px">🏁 গন্তব্য</p><input style="width:100%;border:1px solid #ccc;padding:10px;border-radius:8px" placeholder="জিইসি মোড়"><button style="width:100%;background:#16a34a;color:white;padding:14px;border-radius:12px;margin-top:16px;font-weight:bold">গাড়ি খুঁজুন 🔍</button></div></div></body></html>
