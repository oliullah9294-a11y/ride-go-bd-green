<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride Go BD - Green Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{background:#eef6ee;display:flex;justify-content:center}
.phone{width:100%;max-width:420px;background:#fff;min-height:100vh}
.top{height:52vh;background:linear-gradient(180deg,#16a34a 0%,#0d7a36 100%);border-radius:0 0 44px 44px;padding:20px;position:relative}
.nav{display:flex;justify-content:space-between;align-items:center;color:#fff}
.logo{font-size:19px;font-weight:700}
.lang{border:1px solid #ffffff99;padding:4px 12px;border-radius:99px;font-size:12px}
.top h1{color:#fff;text-align:center;margin-top:36px;font-size:27px;line-height:1.25}
.top p{color:#e8ffe8;text-align:center;margin-top:8px;font-size:14px}
.card{margin:-95px 18px 20px 18px;background:#fff;border-radius:28px;padding:26px 16px;box-shadow:0 12px 30px rgba(0,0,0,.12);position:relative;z-index:2}
.card h2{text-align:center;font-size:21px;color:#111}
.card .sub{text-align:center;color:#777;font-size:13px;margin:4px 0 20px 0}
.btn{width:100%;display:flex;align-items:center;gap:14px;padding:15px 14px;border-radius:18px;border:none;font-size:15px;font-weight:600;text-align:left}
.btn-green{background:#15803d;color:#fff}
.btn-white{background:#fff;color:#111;border:2px solid #dcfce7;margin-top:12px}
.ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.bg1{background:#fff;color:#15803d}
.bg2{background:#dcfce7;color:#15803d}
.small{font-size:11px;font-weight:400;opacity:.9}
.live{text-align:center;margin-top:18px;font-size:12px;color:#16a34a;background:#f0fdf4;padding:8px;border-radius:99px}
</style>
</head>
<body>
<div class="phone">
<div class="top">
<div class="nav"><div class="logo">🛵 Ride Go BD</div><div class="lang">🌐 বাংলা | English</div></div>
<h1>আপনার যাত্রা,<br>আমাদের দায়িত্ব</h1>
<p>নিরাপদ ও নির্ভরযোগ্য রাইড শেয়ারিং</p>
</div>
<div class="card">
<h2>Ride Go BD তে স্বাগতম</h2>
<div class="sub">আপনার যাত্রা শুরু করুন</div>
<button class="btn btn-green" onclick="location.reload()"><div class="ic bg1">👤+</div><div>নতুন? নিবন্ধন করুন<br><span class="small">নতুন অ্যাকাউন্ট তৈরি করুন</span></div></button>
<button class="btn btn-white"><div class="ic bg2">→</div><div>অ্যাকাউন্ট আছে? <span style="color:#16a34a">লগইন করুন</span><br><span class="small" style="color:#777">ফোন নম্বর দিয়ে ওটিপি লগইন</span></div></button>
<div class="live">● LIVE GREEN - আপডেট হয়েছে</div>
</div>
</div>
</body>
</html>
