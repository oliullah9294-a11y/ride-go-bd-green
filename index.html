<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride Go BD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f0f2f5}
.header{background:#16a34a;color:white;padding:55px 20px 85px;position:relative;text-align:center;border-radius:0 0 28px 28px}
.logo{position:absolute;top:14px;left:14px;font-weight:bold}
.lang{position:absolute;top:12px;right:12px}
.lang select{padding:6px 14px;border-radius:20px;border:none;background:white;color:#16a34a;font-weight:bold}
.title{font-size:27px;font-weight:900;margin-top:10px}
.card{margin:22px 16px 20px;background:white;border-radius:20px;padding:18px;box-shadow:0 8px 20px rgba(0,0,0,0.12)}
.btn{width:100%;padding:15px;border-radius:14px;border:none;font-weight:bold;font-size:15px;margin-bottom:12px;cursor:pointer;display:block;text-align:center}
.btn-green{background:#14532d;color:white;margin-top:4px}
.btn-white{background:#fff;color:#111;border:1px solid #ddd}
.page{display:none;padding:20px}
.active{display:block}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:12px}
</style>
</head>
<body>

<div id="home" class="active">
  <div class="header">
    <div class="logo">🛵 Ride Go BD</div>
    <div class="lang">
      <select id="langSelect" onchange="changeLang(this.value)">
        <option value="bn">🇧🇩 বাংলা</option>
        <option value="en">🇬🇧 English</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="hi">🇮🇳 हिंदी</option>
        <option value="ur">🇵🇰 اردو</option>
        <option value="es">🇪🇸 Español</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="ms">🇲🇾 Melayu</option>
      </select>
    </div>
    <div class="title" id="t1">আপনার যাত্রা,<br>আমাদের দায়িত্ব</div>
  </div>
  <div class="card">
    <button class="btn btn-green" id="b1" onclick="go('reg')">+ নতুন? নিবন্ধন করুন</button>
    <button class="btn btn-white" id="b2" onclick="go('login')">→ অ্যাকাউন্ট আছে? লগইন করুন</button>
  </div>
</div>

<div id="reg" class="page">
  <h2 id="rTitle" style="color:#14532d;text-align:center;margin:20px 0">নিবন্ধন করুন</h2>
  <input id="namePh" placeholder="আপনার নাম">
  <input placeholder="ফোন: +880">
  <input placeholder="স্পন্সর কোড (ঐচ্ছিক)">
  <button class="btn btn-green" style="margin-top:10px" id="rb">নিবন্ধন করুন</button>
  <button class="btn btn-white" onclick="go('home')">পিছনে</button>
</div>

<div id="login" class="page">
  <h2 style="color:#14532d;text-align:center;margin:20px 0">লগইন করুন</h2>
  <input placeholder="ফোন নম্বর">
  <input placeholder="পাসওয়ার্ড" type="password">
  <button class="btn btn-green" style="margin-top:10px">লগইন</button>
  <button class="btn btn-white" onclick="go('home')">পিছনে</button>
</div>

<script>
const L={
bn:{t1:"আপনার যাত্রা,<br>আমাদের দায়িত্ব",b1:"+ নতুন? নিবন্ধন করুন",b2:"→ অ্যাকাউন্ট আছে? লগইন করুন",r:"নিবন্ধন করুন",rb:"নিবন্ধন করুন",ph:"আপনার নাম"},
en:{t1:"Your Journey,<br>Our Responsibility",b1:"+ New? Register",b2:"→ Have account? Login",r:"Register",rb:"Register",ph:"Your Name"},
ar:{t1:"رحلتك،<br>مسؤوليتنا",b1:"+ جديد؟ سجل",b2:"→ لديك حساب؟ دخول",r:"التسجيل",rb:"سجل",ph:"اسمك"},
hi:{t1:"आपकी यात्रा,<br>हमारी जिम्मेदारी",b1:"+ नया? रजिस्टर",b2:"→ खाता है? लॉगिन",r:"पंजीकरण",rb:"रजिस्टर",ph:"आपका नाम"},
ur:{t1:"آپ کا سفر،<br>ہماری ذمہ داری",b1:"+ نیا؟ رجسٹر",b2:"→ اکاؤنٹ ہے؟ لاگ ان",r:"رجسٹریشن",rb:"رجسٹر",ph:"آپ کا نام"},
es:{t1:"Tu Viaje,<br>Nuestra Responsabilidad",b1:"+ Nuevo? Registrarse",b2:"→ ¿Tienes cuenta? Entrar",r:"Registrarse",rb:"Registrarse",ph:"Tu Nombre"},
fr:{t1:"Votre Voyage,<br>Notre Responsabilité",b1:"+ Nouveau? S'inscrire",b2:"→ Vous avez un compte? Connexion",r:"S'inscrire",rb:"S'inscrire",ph:"Votre Nom"},
ms:{t1:"Perjalanan Anda,<br>Tanggungjawab Kami",b1:"+ Baru? Daftar",b2:"→ Ada akaun? Log Masuk",r:"Daftar",rb:"Daftar",ph:"Nama Anda"}
};
function go(id){
document.getElementById('home').classList.remove('active');
document.getElementById('reg').classList.remove('active');
document.getElementById('login').classList.remove('active');
document.getElementById(id).classList.add('active');
}
function changeLang(v){localStorage.setItem('lg',v);apply(v)}
function apply(v){
let d=L[v]||L.bn;
document.getElementById('t1').innerHTML=d.t1;
document.getElementById('b1').innerText=d.b1;
document.getElementById('b2').innerText=d.b2;
document.getElementById('rTitle').innerText=d.r;
document.getElementById('rb').innerText=d.rb;
document.getElementById('namePh').placeholder=d.ph;
document.getElementById('langSelect').value=v;
}
apply(localStorage.getItem('lg')||'bn');
</script>
</body>
</html>
