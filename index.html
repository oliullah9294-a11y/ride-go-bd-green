<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride Go BD Green - 29 Pages Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5fdf5}
header{background:#0a7a2e;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:99}
.nav{display:flex;gap:6px;padding:10px;background:#fff;overflow:auto;position:sticky;top:60px;z-index:98;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.nav button{padding:8px 14px;border:none;border-radius:20px;background:#e8f5e9;color:#0a7a2e;font-weight:700;cursor:pointer;white-space:nowrap}
.nav button.active{background:#0a7a2e;color:#fff}
.page{padding:16px;max-width:900px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.card h3{color:#0a7a2e;margin-bottom:8px}
.btn{display:inline-block;background:#0a7a2e;color:#fff;padding:10px 18px;border-radius:10px;text-decoration:none;margin-top:8px;border:none;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{display:inline-block;background:#d4edda;padding:4px 10px;border-radius:12px;font-size:12px}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>🚲 Ride Go BD Green</h1>
<p>Final 29 Pages - H(7) P(8) D(7) W(7)</p>
</header>
<div class="nav" id="mainNav"></div>
<div id="pages"></div>
<script>
const pages=[
{id:'H1',cat:'H',t:'Home Dashboard',d:'Main dashboard'},
{id:'H2',cat:'H',t:'Search Ride',d:'Search nearby rides'},
{id:'H3',cat:'H',t:'Live Map',d:'Live tracking'},
{id:'H4',cat:'H',t:'Offers',d:'Today offers'},
{id:'H5',cat:'H',t:'Emergency',d:'Emergency contact'},
{id:'H6',cat:'H',t:'Favorites',d:'Favorite routes'},
{id:'H7',cat:'H',t:'History',d:'Ride history'},
{id:'P1',cat:'P',t:'Profile',d:'User profile'},
{id:'P2',cat:'P',t:'Edit Profile',d:'Edit info'},
{id:'P3',cat:'P',t:'Wallet',d:'Wallet balance'},
{id:'P4',cat:'P',t:'Add Money',d:'Add money'},
{id:'P5',cat:'P',t:'Transactions',d:'Transactions'},
{id:'P6',cat:'P',t:'Refer & Earn',d:'Refer friends'},
{id:'P7',cat:'P',t:'Settings',d:'App settings'},
{id:'P8',cat:'P',t:'Help Center',d:'Help & support'},
{id:'D1',cat:'D',t:'Driver Dashboard',d:'Driver home'},
{id:'D2',cat:'D',t:'Ride Request',d:'New requests'},
{id:'D3',cat:'D',t:'Active Ride',d:'Ongoing ride'},
{id:'D4',cat:'D',t:'Earnings',d:'Earnings'},
{id:'D5',cat:'D',t:'Driver Profile',d:'Driver info'},
{id:'D6',cat:'D',t:'Documents',d:'Upload docs'},
{id:'D7',cat:'D',t:'Ratings',d:'Customer ratings'},
{id:'W1',cat:'W',t:'Admin Panel',d:'Admin dashboard'},
{id:'W2',cat:'W',t:'Users Manage',d:'Manage users'},
{id:'W3',cat:'W',t:'Drivers Manage',d:'Manage drivers'},
{id:'W4',cat:'W',t:'Rides Manage',d:'All rides'},
{id:'W5',cat:'W',t:'Payments',d:'Payments report'},
{id:'W6',cat:'W',t:'Reports',d:'Analytics'},
{id:'W7',cat:'W',t:'Green Points',d:'Eco points'}
];
const nav=document.getElementById('mainNav');
const pagesDiv=document.getElementById('pages');
function render(){
 const cats=['All','H','P','D','W'];
 cats.forEach(c=>{
  const b=document.createElement('button');
  b.textContent=c==='All'?'সব (29)':c+' ('+pages.filter(p=>p.cat===c).length+')';
  b.onclick=()=>filterCat(c,b);
  if(c==='All')b.classList.add('active');
  nav.appendChild(b);
 });
 pages.forEach(p=>{
  const div=document.createElement('div');
  div.className='page';
  div.id='page-'+p.id;
  div.dataset.cat=p.cat;
  div.innerHTML=`<div class="card"><span class="badge">${p.cat}</span> <span class="badge">${p.id}</span><h3>${p.id} - ${p.t}</h3><p>${p.d}</p><p style="margin-top:8px">এই পেজটি ${p.cat} ক্যাটাগরির। H=Home, P=Passenger, D=Driver, W=Web/Admin</p><button class="btn" onclick="goNext('${p.id}')">পরবর্তী ➡️</button><button class="btn" style="background:#e8f5e9;color:#0a7a2e;margin-left:6px" onclick="goPrev('${p.id}')">⬅️ আগের</button></div><div class="grid"><div class="card"><h3>🚴 Ride</h3><p>Book now</p></div><div class="card"><h3>💰 500 BDT</h3><p>Wallet</p></div><div class="card"><h3>🌱 120</h3><p>Green points</p></div></div>`;
  pagesDiv.appendChild(div);
 });
}
function filterCat(cat,btn){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 document.querySelectorAll('.page').forEach(pg=>{
  if(cat==='All'||pg.dataset.cat===cat)pg.classList.remove('hidden');
  else pg.classList.add('hidden');
 });
 window.scrollTo(0,0);
}
function goNext(id){let i=pages.findIndex(p=>p.id===id);if(i<28)document.getElementById('page-'+pages[i+1].id).scrollIntoView({behavior:'smooth'});}
function goPrev(id){let i=pages.findIndex(p=>p.id===id);if(i>0)document.getElementById('page-'+pages[i-1].id).scrollIntoView({behavior:'smooth'});}
render();
</script>
</body>
</html>
