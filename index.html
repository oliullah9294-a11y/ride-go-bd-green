<!-- ফাইনাল হোম পেজ - লাল দাগ কাটা -->
<div id="home" class="page active">
  <div style="background:#14532d;color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 18px 18px">
    <b>🛵 Ride Go BD</b>
    <div style="display:flex;align-items:center;gap:8px">
      <!-- ভাষা পরিবর্তন আইকন সহ সব ভাষা -->
      <div style="background:white;border-radius:20px;padding:4px 10px;display:flex;align-items:center;gap:4px">
        <span style="font-size:14px">🌐</span>
        <select id="langSelect" style="border:none;background:transparent;font-weight:bold;font-size:12px;outline:none;color:#14532d">
          <option value="bn">বাংলা</option>
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
          <option value="ar">العربية</option>
          <option value="ur">اردو</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="zh">中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="tr">Türkçe</option>
          <option value="ms">Melayu</option>
          <option value="id">Indonesia</option>
        </select>
      </div>
    </div>
  </div>
  
  <div style="padding:20px 16px">
    <h3 style="font-size:18px">স্বাগতম! 🎉</h3>
    <p style="font-size:13px;color:#666;margin:6px 0 18px">আপনি কি হিসেবে যাত্রা করবেন?</p>
    
    <!-- শুধু যাত্রী ও চালক - বড় বাটন -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div style="background:#14532d;color:white;padding:32px 10px;border-radius:18px;text-align:center;font-weight:bold;box-shadow:0 4px 12px rgba(20,83,45,0.3)">
        <div style="font-size:32px">🧍</div>
        <div style="margin-top:10px;font-size:16px">যাত্রী</div>
        <div style="font-size:11px;opacity:.8;font-weight:normal;margin-top:2px">রাইড খুঁজুন</div>
      </div>
      <div style="background:white;padding:32px 10px;border-radius:18px;text-align:center;font-weight:bold;border:1px solid #e5e7eb">
        <div style="font-size:32px">🏍️</div>
        <div style="margin-top:10px;font-size:16px">চালক</div>
        <div style="font-size:11px;color:#666;font-weight:normal;margin-top:2px">আয় করুন</div>
      </div>
    </div>

    <!-- Owner - ছোট -->
    <div style="text-align:center;margin-top:28px">
      <span style="font-size:10px;color:#aaa;border:1px dashed #ccc;padding:6px 14px;border-radius:20px">Owner</span>
    </div>

    <!-- লগআউট -->
    <button onclick="go('landing')" style="width:100%;padding:15px;border-radius:14px;border:1px solid #ddd;background:white;font-weight:bold;margin-top:26px;font-size:14px">লগআউট</button>
  </div>
</div>

<script>
function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}
document.getElementById('langSelect').addEventListener('change', function(){
  // ভাষা পরিবর্তনের লজিক পরে যোগ হবে
  console.log('Language:', this.value);
});
</script>
