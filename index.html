<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ride Go BD Green - V5.4 Fix</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
.hdr{background:#0a7a2e;color:#fff;padding:14px;display:flex;gap:10px;align-items:center;font-weight:900;position:sticky;top:0}
.logo{background:#fff;color:#0a7a2e;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900}
.page{display:none;min-height:100vh;background:#fff;max-width:480px;margin:auto}
.page.active{display:block!important}
.box{padding:20px}
.btn{background:#0a7a2e;color:#fff;border:0;padding:18px;border-radius:14px;width:100%;font-weight:800;margin-top:12px}
.btn2{background:#eef7ee;color:#0a7a2e;border:1px solid #cfe9cf;padding:15px;border-radius:14px;width:100%;font-weight:700;margin-top:10px}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #ccc;margin:8px 0}
.card{background:#f8fff8;border:1px solid #d9f0d9;padding:14px;border-radius:14px;margin:10px 0}
</style>
</head>
<body>
<div id="H1" class="page active"><div class="hdr"><div class="logo">RG</div>Ride Go BD Green</div><div class="box" style="text-align:center"><h2 style="color:#0a7a2e">Ride Go BD Green</h2><p>Safe Ride</p><button class="btn" onclick="goPage('H2')">শুরু করুন →</button></div></div>
<div id="H2" class="page"><div class="hdr"><div class="logo">RG</div>H2 নিবন্ধন</div><div class="box"><input id="reg-name" placeholder="নাম"><input id="reg-phone" placeholder="মোবাইল"><button class="btn" onclick="doReg()">রেজিস্ট্রেশন →</button><button class="btn2" onclick="goPage('H1')">Back</button></div></div>
<div id="H5" class="page"><div class="hdr"><div class="logo">RG</div>H5 শাখা</div><div class="box"><div style="text-align:center;font-weight:900">ভূমিকা - <span id="u"></span></div><div class="btn" style="text-align:center" onclick="goPage('P1')">🧍 যাত্রী</div><div class="btn2" style="text-align:center" onclick="goPage('DP')">🏍️ চালক প্রোফাইল</div><button class="btn2" onclick="doLogout()">লগআউট</button></div></div>
<div id="DP" class="page"><div class="hdr"><div class="logo">RG</div>চালক প্রোফাইল (ঐচ্ছিক)</div><div class="box"><p style="font-size:12px;background:#eef7ee;padding:8px;border-radius:8px" id="prog">প্রোফাইল 0% (ঐচ্ছিক)</p><input id="d-name" placeholder="নাম (ঐচ্ছিক)"><input id="d-vehicle" placeholder="গাড়ি নাম্বার (ঐচ্ছিক)"><input id="d-fitness" placeholder="ফিটনেস নম্বর (ঐচ্ছিক)"><select id="d-type"><option>গাড়ির ধরন (ঐচ্ছিক)</option><option>Bike</option><option>CNG</option><option>Car</option></select><button class="btn" onclick="saveDP()">সেভ (ঐচ্ছিক)</button><button class="btn2" onclick="goPage('D1')">Skip → D1</button><button class="btn2" onclick="goPage('H5')">Back H5</button></div></div>
<div id="P1" class="page"><div class="hdr"><div class="logo">RG</div>P1</div><div class="box">যাত্রী P1 <button class="btn2" onclick="goPage('H5')">Back H5</button></div></div>
<div id="D1" class="page"><div class="hdr"><div class="logo">RG</div>D1</div><div class="box"><p>গাড়ি: <b id="vShow">ঐচ্ছিক</b> | ফিটনেস: <b id="fShow">ঐচ্ছিক</b></p><button class="btn2" onclick="goPage('H5')">Back H5</button></div></div>
<script>
function goPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='DP')loadDP();if(id==='D1')showD();if(id==='H5')document.getElementById('u').innerText=localStorage.getItem('userPhone')||'';window.scrollTo(0,0);}
function doReg(){let n=document.getElementById('reg-name').value||'User';let p=document.getElementById('reg-phone').value;if(p.length<11){alert('১১ ডিজিট দিন');return;}localStorage.setItem('userName',n);localStorage.setItem('userPhone',p);localStorage.setItem('isRegistered','true');goPage('H5');}
function checkLogin(){if(localStorage.getItem('isRegistered')){goPage('H5');}else{goPage('H1');}}
function doLogout(){localStorage.clear();goPage('H1');}
function saveDP(){let d={name:document.getElementById('d-name').value,vehicle:document.getElementById('d-vehicle').value,fitness:document.getElementById('d-fitness').value};localStorage.setItem('driverProfile',JSON.stringify(d));alert('সেভ হয়েছে');goPage('D1');}
function loadDP(){let d=JSON.parse(localStorage.getItem('driverProfile')||'{}');if(d.name)document.getElementById('d-name').value=d.name;if(d.vehicle)document.getElementById('d-vehicle').value=d.vehicle;if(d.fitness)document.getElementById('d-fitness').value=d.fitness;}
function showD(){let d=JSON.parse(localStorage.getItem('driverProfile')||'{}');document.getElementById('vShow').innerText=d.vehicle||'ঐচ্ছিক';document.getElementById('fShow').innerText=d.fitness||'ঐচ্ছিক';}
checkLogin();
</script>
</body>
</html>
