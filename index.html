<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride Go BD - Official</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
.header{background:#16a34a;color:white;padding:15px;text-align:center;font-size:22px;font-weight:bold}
.page{display:none;padding:20px} .active{display:block}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin-top:15px}
.btn{background:#16a34a;color:white;padding:12px 20px;border:none;border-radius:8px;width:100%;font-size:16px;margin-top:10px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
</style>
</head>
<body>
<div class="header">Ride Go BD</div>

<div id="landing" class="page active">
<div class="card">
<h2>Ride Go BD তে স্বাগতম</h2>
<p>বাংলাদেশের জন্য আধুনিক রাইড-ম্যাচিং অ্যাপ</p>
<button class="btn" onclick="show('register')">নতুন নিবন্ধন</button>
<button class="btn" onclick="show('login')">লগইন</button>
</div>
</div>

<div id="register" class="page">
<div class="card">
<h3>নিবন্ধন</h3>
<input placeholder="আপনার নাম">
<input placeholder="মোবাইল নম্বর">
<input placeholder="স্পন্সর নম্বর (ঐচ্ছিক)">
<button class="btn" onclick="show('otp')">নিবন্ধন করুন</button>
<button class="btn" onclick="show('landing')">পিছনে</button>
</div>
</div>

<div id="login" class="page">
<div class="card">
<h3>লগইন</h3>
<input placeholder="মোবাইল নম্বর">
<button class="btn" onclick="show('otp')">OTP পাঠান</button>
<button class="btn" onclick="show('landing')">পিছনে</button>
</div>
</div>

<div id="otp" class="page">
<div class="card">
<h3>OTP যাচাই</h3>
<input placeholder="৪ সংখ্যার OTP">
<button class="btn" onclick="show('home')">যাচাই করুন</button>
</div>
</div>

<div id="home" class="page">
<div class="card">
<h3>Main Home</h3>
<p>যাত্রী ও চালক - একই অ্যাকাউন্ট</p>
<button class="btn" onclick="alert('যাত্রী: বর্তমান অবস্থান + গন্তব্য - পরবর্তী ধাপে বানাবো')">আমি যাত্রী</button>
<button class="btn" onclick="alert('চালক: রিকোয়েস্ট দেখা - পরবর্তী ধাপে বানাবো')">আমি চালক</button>
<button class="btn" onclick="show('owner')">Owner Panel</button>
<button class="btn" onclick="show('landing')">Logout</button>
</div>
</div>

<div id="owner" class="page">
<div class="card">
<h3>Owner Panel</h3>
<p>মোট রাইড, আয়, সার্ভিস ফি ১০ টাকা</p>
<button class="btn" onclick="show('home')">পিছনে যান</button>
</div>
</div>

<script>
function show(id){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
}
</script>
</body>
</html>
