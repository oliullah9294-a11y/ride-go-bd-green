<title>Ride Go BD V6 - D1 Update Full</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#eef6ee}
.hdr{background:linear-gradient(135deg,#0a7a2e,#14a843);color:#fff;padding:16px 20px;display:flex;gap:12px;align-items:center;font-weight:900;position:sticky;top:0;z-index:99;box-shadow:0 4px 20px #0a7a2e33}
.logo{background:#fff;color:#0a7a2e;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer;box-shadow:0 2px 10px #0002}
.page{display:none;min-height:100vh;background:#fff;max-width:480px;margin:auto;box-shadow:0 0 40px #0001}
.page.active{display:block;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.box{padding:22px}
.btn{background:linear-gradient(135deg,#0a7a2e,#14a843);color:#fff;border:0;padding:18px;border-radius:16px;width:100%;font-weight:800;margin-top:14px;cursor:pointer;font-size:16px;box-shadow:0 6px 18px #0a7a2e30;transition:0.2s}
.btn:active{transform:scale(0.97)}
.btn2{background:#eef7ee;color:#0a7a2e;border:1.5px solid #cfe9cf;padding:15px;border-radius:16px;width:100%;font-weight:700;margin-top:10px;cursor:pointer}
.card{background:#f8fff8;border:1.5px solid #d9f0d9;padding:16px;border-radius:16px;margin:12px 0;box-shadow:0 2px 8px #00006}
.driverCard{background:#fff;border:2px solid #0a7a2e;padding:14px;border-radius:16px;margin:10px 0;box-shadow:0 4px 12px #0a7a2e15}
.inputBox{background:#fff;border-radius:14px;padding:14px;border:1.5px solid #ddd;margin:8px 0;display:flex;align-items:center;gap:10px}
.inputBox input{border:0;outline:none;width:100%;font-size:16px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.statBox{background:linear-gradient(135deg,#f8fff8,#eef7ee);border:1px solid #d9f0d9;padding:14px;border-radius:16px;text-align:center}
.toggle{width:60px;height:34px;background:#ccc;border-radius:20px;position:relative;cursor:pointer;display:inline-block;transition:0.3s;box-shadow:inset 0 2px 6px #0002}
.toggle.on{background:linear-gradient(135deg,#0a7a2e,#14a843);box-shadow:0 0 12px #0a7a2e40}
.toggleDot{width:28px;height:28px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:0.3s;box-shadow:0 2px 6px #0003}
.toggle.on .toggleDot{left:29px}
.statusOnline{background:#0a7a2e;color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.statusOffline{background:#d00;color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.pulseDot{width:10px;height:10px;background:#fff;border-radius:50%;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
</style>
</head>
