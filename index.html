<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride Go BD</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f5f5f5;font-family:sans-serif}
  .header{background:#16a34a;color:white;padding:70px 20px 80px;position:relative;text-align:center;border-radius:0 0 20px 20px}
  .logo{position:absolute;top:15px;left:15px;font-weight:bold}
  .lang-box{position:absolute;top:12px;right:12px}
  .lang-box select{padding:7px 12px;border-radius:20px;border:none;background:white;color:#16a34a;font-weight:bold}
  .title{font-size:28px;font-weight:900;line-height:1.3}
  .card{margin:-50px 15px 0;background:white;border-radius:20px;padding:15px;box-shadow:0 10px 25px rgba(0,0,0,0.1)}
  .btn{width:100%;padding:16px;border-radius:15px;border:none;font-weight:bold;margin-bottom:12px;cursor:pointer}
  .btn-green{background:#14532d;color:white}
  .btn-white{background:white;color:black;border:1px solid #ddd}
</style>
</head>
<body>
<div class="header">
  <div class="logo">🛵 Ride Go BD</div>
  <div class="lang-box">
    <select id="langSelect" onchange="changeLang(this.value)">
      <option value="bn">🇧🇩 বাংলা</option>
      <option value="en">🇬🇧 English</option>
      <option value="ar">🇸🇦 العربية</option>
      <option value="hi">🇮🇳 हिंदी</option>
      <option value="ur">🇵🇰 اردو</option>
      <option value="es">🇪🇸 Español</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="ms">🇲🇾 Melayu</option>
    </select>
  </div>
  <div class="title" id="mainTitle">আপনার যাত্রা,<br>আমাদের দায়িত্ব</div>
</div>
<div class="card">
  <button class="btn btn-green" id="btnReg">👤 + নতুন? নিবন্ধন করুন</button>
  <button class="btn btn-white" id="btnLogin">→ অ্যাকাউন্ট আছে? লগইন করুন</button>
</div>

<script>
const dict = {
  bn: {title:"আপনার যাত্রা,<br>আমাদের দায়িত্ব", reg:"👤 + নতুন? নিবন্ধন করুন", login:"→ অ্যাকাউন্ট আছে? লগইন করুন"},
  en: {title:"Your Journey,<br>Our Responsibility", reg:"👤 + New? Register", login:"→ Have account? Login"},
  ar: {title:"رحلتك،<br>مسؤوليتنا", reg:"👤 + جديد؟ سجل", login:"→ لديك حساب؟ دخول"},
  hi: {title:"आपकी यात्रा,<br>हमारी जिम्मेदारी", reg:"👤 + नया? रजिस्टर", login:"→ खाता है? लॉगिन"},
  ur: {title:"آپ کا سفر،<br>ہماری ذمہ داری", reg:"👤 + نیا؟ رجسٹر", login:"→ اکاؤنٹ ہے؟ لاگ ان"},
  es: {title:"Tu Viaje,<br>Nuestra Responsabilidad", reg:"👤 + Nuevo? Registrarse", login:"→ ¿Tienes cuenta? Entrar"},
  fr: {title:"Votre Voyage,<br>Notre Responsabilité", reg:"👤 + Nouveau? S'inscrire", login:"→ Vous avez un compte? Connexion"},
  ms: {title:"Perjalanan Anda,<br>Tanggungjawab Kami", reg:"👤 + Baru? Daftar", login:"→ Ada akaun? Log Masuk"}
};
function changeLang(l){localStorage.setItem('rideLang',l);applyLang(l)}
function applyLang(l){
  let t=dict[l]||dict.bn;
  document.getElementById('mainTitle').innerHTML=t.title;
  document.getElementById('btnReg').innerText=t.reg;
  document.getElementById('btnLogin').innerText=t.login;
  document.getElementById('langSelect').value=l;
}
applyLang(localStorage.getItem('rideLang')||'bn');
</script>
</body>
</html>
