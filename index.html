<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ride Go BD - Red Design</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#c00}
.page{display:none;min-height:100vh;max-width:480px;margin:auto;background:radial-gradient(circle at 50% 35%,#fff 40%,#ffe6e6 70%,#ffb3b3 100%);position:relative;overflow:hidden}
.page:before{content:'';position:absolute;top:0;left:-20%;width:140%;height:55%;background:#fff;border-radius:0 0 60% 60%;z-index:0}
.page:after{content:'';position:absolute;bottom:-10%;left:-20%;width:140%;height:50%;background:#fff;border-radius:60% 60% 0 0;z-index:0}
.page.active{display:block}
.hdr{position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding:14px 18px;font-weight:900;color:#0a7a2e;background:transparent}
.logoTop{display:flex;align-items:center;gap:6px}
.carIcon{width:60px;height:30px;background:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><text y=%2220%22 font-size=%2220%22>🚗</text></svg>')}
.box{position:relative;z-index:2;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:85vh}
.heroImg{width:100%;height:340px;background:linear-gradient(#87ceeb,#fff);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:80px;box-shadow:0 10px 30px #0002;overflow:hidden;position:relative}
.heroImg:before{content:'🏙️';position:absolute;top:10px;left:0;right:0;text-align:center;font-size:100px;opacity:0.3}
.btnRed{background:linear-gradient(135deg,#0a7a2e,#14b848);color:#fff;border:0;padding:18px 24px;border-radius:24px;width:100%;max-width:340px;font-weight:800;font-size:18px;margin-top:14px;cursor:pointer;box-shadow:0 6px 16px #0a7a2e50;display:flex;align-items:center;justify-content:center;gap:10px}
.btnWhite{background:#fff;color:#000;border:2px solid #0a7a2e;padding:14px 24px;border-radius:24px;width:100%;max-width:340px;font-weight:700;font-size:16px;margin-top:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 12px #0001}
.inputBox{background:#fff;border-radius:24px;padding:14px 18px;width:100%;max-width:340px;margin:8px 0;display:flex;align-items:center;gap:12px;box-shadow:0 4px 12px #0001;border:1px solid #e0e0e0}
.inputBox input{border:0;outline:none;width:100%;font-size:16px}
.iconRed{width:80px;height:80px;background:#d00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;box-shadow:0 6px 18px #d003; margin-bottom:20px}
.toggle{width:52px;height:30px;background:#ddd;border-radius:20px;position:relative;cursor:pointer;display:inline-block}
.toggle.on{background:#0a7a2e}
.toggleDot{width:24px;height:24px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:0.3s}
.toggle.on .toggleDot{left:25px}
</style>
</head>
<body>

<div id="H1" class="page active">
<div class="hdr"><span style="font-size:22px">🚗💨</span><span style="color:#0a7a2e">Ride Go</span><span style="color:#d00">BD</span><span style="margin-left:auto;background:#fff;border-radius:20px;padding:4px 10px;font-size:12px;border:1px solid #ddd">🌐 বাংলা</span></div>
<div class="box">
<div class="heroImg">🚙<div style="position:absolute;bottom:0;left:0;right:0;height:100px;background:linear-gradient(transparent,#0002)"></div></div>
<button class="btnRed" onclick="goPage('H2')">👤+ নতুন? নিবন্ধন করুন</button>
<button class="btnWhite" onclick="goPage('H3')">↗️ অ্যাকাউন্ট আছে? লগইন করুন</button>
</div>
</div>

<div id="H2" class="page">
<div class="hdr"><span>🚗💨</span><span style="color:#0a7a2e">Ride Go</span><span style="color:#d00">BD</span></div>
<div class="box">
<div class="iconRed">👤+</div>
<div class="inputBox"><span style="color:#0a7a2e;font-size:20px">👤</span><input id="reg-name" placeholder="আপনার নাম"></div>
<div class="inputBox"><span style="color:#0a7a2e;font-size:20px">📞</span><input id="reg-phone" placeholder="ফোন নাম্বার"></div>
<div class="inputBox"><span style="color:#0a7a2e;font-size:20px">👥</span><input id="reg-sponsor" placeholder="স্পন্সর নাম্বার"></div>
<button class="btnRed" onclick="doReg()">✓ নিবন্ধন করুন</button>
<button class="btnWhite" onclick="goPage('H1')">← পিছনে</button>
</div>
</div>

<div id="H3" class="page">
<div class="hdr"><span>🚗💨</span><span style="color:#0a7a2e">Ride Go</span><span style="color:#d00">BD</span></div>
<div class="box">
<div class="iconRed">🔒</div>
<div class="inputBox"><span style="color:#0a7a2e;font-size:20px">📱</span><input id="login-phone" placeholder="ফোন নাম্বার"></div>
<button class="btnRed" onclick="goPage('H5')">↗️ লগইন করুন</button>
<button class="btnWhite" onclick="goPage('H1')">← পিছনে</button>
</div>
</div>

<div id="H5" class="page">
<div class="hdr"><span>🚗💨</span><span style="color:#0a7a2e">Ride Go</span><span style="color:#d00">BD</span></div>
<div class="box">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:340px">
<div style="background:linear-gradient(135deg,#0a7a2e,#14b848);color:#fff;border-radius:20px;padding:20px;text-align:center;cursor:pointer;box-shadow:0 6px 16px #0a7a2e40" onclick="goPage('P1')"><div style="font-size:40px">👤</div><b>যাত্রী</b></div>
<div style="background:#fff;border:2px solid #0a7a2e;border-radius:20px;padding:20px;text-align:center;cursor:pointer" onclick="goPage('D1')"><div style="font-size:40px;color:#0a7a2e">🚗</div><b>গাড়ি</b></div>
</div>
<div style="margin-top:20px;display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px">
<button class="btnWhite" onclick="tapLogo()" style="justify-content:center"><span id="tapCount">0/3</span> Owner</button>
<div id="ownerSecret" style="display:none" class="btnRed" onclick="goPage('W3')">🏢 Owner W1-W13</div>
<button class="btnWhite" onclick="doLogout()">↗️ Logout</button>
</div>
</div>
</div>

<script>
var tap=0;
function goPage(id){
 var pages=document.getElementsByClassName('page');
 for(var i=0;i<pages.length;i++){ pages[i].style.display='none'; }
 document.getElementById(id).style.display='block';
 if(id==='H5'){ var us=document.getElementById('userShow'); if(us) us.innerText=localStorage.getItem('userPhone')||''; }
}
function doReg(){ var n=document.getElementById('reg-name').value; var ph=document.getElementById('reg-phone').value; if(ph.length<11){ alert('ফোন দিন'); return; } localStorage.setItem('userPhone',ph); localStorage.setItem('isRegistered','true'); goPage('H5'); }
function doLogout(){ localStorage.removeItem('isRegistered'); goPage('H1'); }
function tapLogo(){ tap++; var c=document.getElementById('tapCount'); if(c) c.innerText=tap+'/3'; if(tap>=3){ document.getElementById('ownerSecret').style.display='flex'; tap=0; } setTimeout(function(){ tap=0; var cc=document.getElementById('tapCount'); if(cc) cc.innerText='0/3'; },3000); }
</script>
</body>
</html>
