<script>
function showPage(p){
  document.querySelectorAll('[id^="page-"]').forEach(el=>el.classList.add('hidden'));
  document.getElementById('page-'+p).classList.remove('hidden');
}
function sendRegOtp(){
  let phone = document.getElementById('regPhone').value;
  if(phone.length < 5){ alert('ফোন নম্বর লিখুন'); return; }
  document.getElementById('regOtpText').innerText = phone + ' নম্বরে OTP: 1234';
  showPage('register-otp');
}
function sendLoginOtp(){
  let phone = document.getElementById('loginPhone').value;
  if(phone.length < 5){ alert('ফোন নম্বর লিখুন'); return; }
  document.getElementById('loginOtpText').innerText = phone + ' নম্বরে OTP: 1234';
  showPage('login-step2');
}
</script>
