<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ride Go BD - RG Free Service</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0ea5e9">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Hind Siliguri,sans-serif}
body{background:#f0f9ff}
.header{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:white;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99}
.logo{font-size:22px;font-weight:900}
.logo span{background:black;border:2px solid white;padding:0 7px;border-radius:7px}
#langSelect{padding:7px 10px;border-radius:20px;border:none;font-weight:bold;color:#0284c7}
.card{background:white;margin:12px;padding:16px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.07)}
.input{width:100%;padding:13px;border:2px solid #e0f2fe;border-radius:10px;margin:7px 0;font-size:15px}
.btn{width:100%;padding:14px;background:#0ea5e9;color:white;border:none;border-radius:11px;font-size:16px;font-weight:bold;cursor:pointer}
.btn:active{opacity:0.9}
.tabs{display:flex;background:white;margin:12px 12px 0;border-radius:10px;overflow:hidden;flex-wrap:wrap}
.tab{flex:1;padding:10px;text-align:center;cursor:pointer;font-weight:bold;font-size:13px;min-width:60px}
.tab.active{background:#0ea5e9;color:white}
.page{display:none}.page.active{display:block}
.free-box{background:#f0fdf4;border:2px dashed #22c55e;padding:10px;border-radius:10px;margin:10px 0;text-align:center}
.pay-opt{border:1px solid #e5e7eb;padding:12px;border-radius:10px;margin:6px 0}
.pay-opt.disabled{opacity:0.5}
.small-badge{font-size:10px;background:#fef08a;padding:2px 6px;border-radius:10px}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span>RG</span> Ride Go</div>
  <select id="langSelect" onchange="setLang(this.value)">
    <option value="bn">🇧🇩 বাংলা</option>
    <option value="en">🇺🇸 English</option>
    <option value="hi">🇮🇳 हिंदी</option>
    <option value="ur">🇵🇰 اردو</option>
    <option value="ar">🇸🇦 العربية</option>
    <option value="zh">🇨🇳 中文</option>
    <option value="es">🇪🇸 Español</option>
    <option value="fr">🇫🇷 Français</option>
  </select>
</div>

<div class="tabs">
  <div class="tab active" onclick="showPage('home',this)" id="tabHome">হোম</div>
  <div class="tab" onclick="showPage('reg',this)" id="tabReg">রেজিস্ট্রেশন</div>
  <div class="tab" onclick="showPage('payment',this)" id="tabPay">পেমেন্ট</div>
  <div class="tab" onclick="showPage('h5',this)" id="tabH5">H5</div>
</div>

<!-- HOME -->
<div id="home" class="page active">
  <div class="card">
    <h3 id="homeTitle">📍 কোথায় যাবেন?</h3>
    <input class="input" id="fromInput" placeholder="📍 আপনার লোকেশন">
    <input class="input" id="toInput" placeholder="🏁 গন্তব্য">
    <select class="input" id="carSelect"></select>
    <button class="btn" id="bookBtn" onclick="showPage('payment',document.getElementById('tabPay'))">🚀 এখনই বুক করুন</button>
    <img src="icon.png" style="width:100%;border-radius:12px;margin-top:10px">
  </div>
</div>

<!-- REGISTRATION -->
<div id="reg" class="page">
  <div class="card">
    <h3 id="regTitle">📝 রেজিস্ট্রেশন করুন</h3>
    <input class="input" id="nameInput" placeholder="👤 আপনার নাম">
    <input class="input" id="phoneInput" placeholder="📞 মোবাইল নাম্বার">
    <input class="input" id="passInput" type="password" placeholder="🔑 পাসওয়ার্ড">
    <button class="btn" id="regBtn">✅ রেজিস্ট্রেশন করুন</button>
  </div>
</div>

<!-- PAYMENT - FREE SMALL -->
<div id="payment" class="page">
  <div class="card">
    <h3 id="payTitle">💳 পেমেন্ট করুন</h3>
    
    <!-- FREE OPTION SMALL -->
    <div class="free-box">
      <p style="font-size:11px;color:#16a34a;margin:0" id="freeTop">🎉 প্রথম 100 রাইড</p>
      <p style="font-weight:bold;color:#16a34a;font-size:15px;margin:3px 0" id="freeMain">✅ FREE - ফ্রি সার্ভিস</p>
      <button class="btn" style="background:#22c55e;padding:8px 18px;font-size:13px;width:auto" id="freeBtn" onclick="alert('✅ ফ্রি রাইড বুক হয়েছে!')">ফ্রি তে বুক করুন</button>
    </div>

    <p style="text-align:center;font-size:11px;color:gray;margin:8px 0" id="orText">--- অথবা পেইড অপশন ---</p>

    <div class="pay-opt"><label><input type="radio" name="pay" checked> <span id="cashText">💵 ক্যাশ অন ডেলিভারি (গাড়িতে)</span></label></div>
    <div class="pay-opt disabled"><label><input type="radio" disabled> 📱 bKash <span class="small-badge" id="soon1">শীঘ্রই আসছে</span></label></div>
    <div class="pay-opt disabled"><label><input type="radio" disabled> 📱 নগদ <span class="small-badge" id="soon2">শীঘ্রই আসছে</span></label></div>

    <button class="btn" style="margin-top:12px" id="confirmBtn" onclick="alert('✅ ক্যাশ সিলেক্ট - রাইড বুক!')">✅ কনফার্ম করুন</button>
    <p style="font-size:10px;color:gray;text-align:center;margin-top:8px" id="noteText">* এখন ফ্রি সার্ভিস চলছে, পরে bKash চালু হবে</p>
  </div>
</div>

<!-- H5 -->
<div id="h5" class="page">
  <div class="card">
    <h3 id="h5Title">📱 H5 পেজ</h3>
    <p id="h5Desc">🌐 ভাষা নির্বাচন করুন</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
      <button class="btn" onclick="setLang('bn')">🇧🇩 বাংলা</button>
      <button class="btn" onclick="setLang('en')">🇺🇸 English</button>
      <button class="btn" onclick="setLang('hi')">🇮🇳 हिंदी</button>
      <button class="btn" onclick="setLang('ar')">🇸🇦 العربية</button>
    </div>
    <p id="h5Footer" style="margin-top:12px;background:#e0f2fe;padding:10px;border-radius:8px">✅ Ride Go BD H5 লোড হয়েছে।</p>
  </div>
</div>

function setLang(l){
 const t=T[l]||T.bn;
 document.getElementById('langSelect').value=l;
 document.getElementById('tabHome').innerText=t.home;
 document.getElementById('tabReg').innerText=t.reg;
 document.getElementById('tabPay').innerText=t.pay;
 document.getElementById('tabH5').innerText=t.h5;
 document.getElementById('homeTitle').innerText=t.homeTitle;
 document.getElementById('fromInput').placeholder=t.from;
 document.getElementById('toInput').placeholder=t.to;

 document.getElementById('regBtn').innerText=t.regBtn;
 document.getElementById('payTitle').innerText=t.payTitle;
 document.getElementById('freeTop').innerText=t.freeTop;
 document.getElementById('freeMain').innerText=t.freeMain;
 document.getElementById('freeBtn').innerText=t.freeBtn;
 document.getElementById('orText').innerText=t.orText;
 document.getElementById('cashText').innerText=t.cash;
 document.getElementById('soon1').innerText=t.soon;

 document.getElementById('confirmBtn').innerText=t.confirm;

 document.getElementById('h5Title').innerText=t.h5Title;
 document.getElementById('h5Desc').innerText=t.h5Desc;
 document.getElementById('h5Footer').innerText=t.h5Footer;
 document.getElementById('carSelect').innerHTML=t.cars.map(c=>`<option>${c}</option>`).join('');
 localStorage.setItem('rg_lang',l);
}
function showPage(p,el){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 document.getElementById(p).classList.add('active');
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 el.classList.add('active');
}
