<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RG V5.4.2 ULTRA FIX - H2 100%</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
.page{display:none;min-height:100vh;max-width:480px;margin:auto;background:#fff;padding:20px}
#H1{display:block} /* প্রথমে H1 দেখাও */
#H2:target,#H1:target,#H5:target{display:block} /* CSS fallback - JS ছাড়াও কাজ করবে */
.page.active{display:block!important}
.btn{background:#0a7a2e;color:#fff;border:0;padding:18px;border-radius:14px;width:100%;font-weight:800;font-size:18px;margin-top:12px;display:block;text-align:center;text-decoration:none}
.btn2{background:#eef7ee;color:#0a7a2e;border:1px solid #cfe9cf;padding:15px;border-radius:14px;width:100%;font-weight:700;margin-top:10px;display:block;text-align:center;text-decoration:none}
</style>
</head>
<body>

<div id="H1" class="page active" style="display:block">
<h1 style="text-align:center;margin-top:30px;color:#0a7a2e">RG V5.4.2</h1>
<p style="text-align:center">H1 থেকে H2 - ULTRA FIX</p>
<!-- 2 ভাবে H2 তে যাবে - JS + CSS -->
<a href="#H2" class="btn" onclick="showH2(); return false;">শুরু করুন → H2 - JS</a>
<a href="#H2" class="btn2" style="margin-top:10px">শুরু করুন → H2 - CSS (JS Fail হলেও যাবে)</a>
<p style="font-size:11px;text-align:center;margin-top:10px;color:red">JS Error হলেও নিচের লিংকে H2 আসবে - 100%</p>
</div>

<div id="H2" class="page">
<h2>H2 নিবন্ধন - FOUND!</h2>
<p style="background:#eef7ee;padding:8px;border-radius:8px">✓ H2 এসেছে - মানে Fix কাজ করেছে!</p>
<input placeholder="নাম *"><input placeholder="মোবাইল 01XXXXXXXXX *">
<a href="#H5" class="btn" onclick="showPage('H5'); return false;">রেজিস্ট্রেশন → H5</a>
<a href="#H1" class="btn2" onclick="showPage('H1'); return false;">Back H1</a>
</div>

<div id="H5" class="page">
<h2>H5 শাখা - 3 দিকে - Success!</h2>
<p>✅ H1 → H2 → H5 - সব আসছে!</p>
<a href="#H1" class="btn2" onclick="showPage('H1'); return false;">Home H1</a>
</div>

<script>
// ULTRA FIX - forEach নাই - !important নাই - try catch সহ
function showPage(id){
  try{
    var all=document.getElementsByClassName('page');
    for(var i=0;i<all.length;i++){ all[i].style.display='none'; }
    var el=document.getElementById(id);
    if(el){ el.style.display='block'; }
    location.hash=id;
  }catch(e){ 
    // JS Fail হলেও CSS :target দিয়ে H2 আসবে
    location.hash=id;
  }
}
function showH2(){ showPage('H2'); }
// CSS fallback - hash change এও দেখাও
window.onhashchange=function(){
  var h=location.hash.replace('#','')||'H1';
  showPage(h);
};
</script>
</body>
</html>
