<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RG V7.7 FIXED H1->H2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#f2f2f2}
.hdr{background:#0a7a2e;color:#fff;padding:14px;display:flex;gap:10px;align-items:center;font-weight:900;position:sticky;top:0;z-index:99}
.logo{background:#fff;color:#0a7a2e;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900}
.page{display:none;min-height:100vh;background:#fff;max-width:480px;margin:auto}
.page.active{display:block}
.box{padding:20px}
.btn{background:#0a7a2e;color:#fff;border:0;padding:18px;border-radius:14px;width:100%;font-weight:800;margin-top:12px;cursor:pointer;font-size:18px}
.btn2{background:#eef7ee;color:#0a7a2e;border:1px solid #cfe9cf;padding:15px;border-radius:14px;width:100%;font-weight:700;margin-top:10px}
.card{background:#f8fff8;border:1px solid #d9f0d9;padding:14px;border-radius:14px;margin:10px 0}
.badge{background:#0a7a2e;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;float:right}
</style>
<script>
// FIXED - একদম উপরে - কোনো Error নেই - 100% কাজ করবে
function goPage(id){
  try{
    var all=document.querySelectorAll('.page');
    for(var i=0;i<all.length;i++){ all[i].classList.remove('active'); }
    var t=document.getElementById(id);
    if(t){ t.classList.add('active'); window.scrollTo(0,0); }
    else{ alert(id+' পেজ পাওয়া যায়নি'); }
    if(id=='H5'){ var ph=localStorage.getItem('userPhone')||''; var el=document.getElementById('userShow'); if(el) el.innerText=ph; }
  }catch(e){ alert('Error: '+e.message); }
}
function forceH2(){
  document.getElementById('H1').classList.remove('active');
  document.getElementById('H2').classList.add('active');
}
</script>
</head>
<body>

<div id="H1" class="page active"><div class="hdr"><div class="logo">RG</div>Ride Go BD Green</div><div class="box" style="text-align:center"><div style="width:90px;height:90px;background:#0a7a2e;color:#fff;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;margin:30px auto">RG</div><h2 style="color:#0a7a2e">Ride Go BD Green V7.7 FIXED</h2><p>H-H5 → P,D,W + P15 + ক,খ + Sponsor</p>
<button class="btn" onclick="goPage('H2'); forceH2();" id="startBtn">শুরু করুন → H2</button>
<button class="btn2" onclick="goPage('AZ')">
