<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride Go BD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f5f5f5}
.page{display:none;min-height:100vh;background:#f8faf9}
.page.active{display:flex;flex-direction:column}
.box{padding:20px 16px;flex:1}
.btn{width:100%;padding:15px;border-radius:14px;border:none;font-weight:bold;cursor:pointer}
.btn-green{background:#0f3d26;color:white}
.btn-white{background:white;border:1px solid #ddd}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:12px}
</style>
</head>
<body>

<!-- 1. ল্যান্ডিং -->
<div id="landing" class="page active">
  <div style="background:#16a34a;color:white;padding:60px 20px 115px;text-align:center;border-radius:0 0 32px 32px;position:relative">
    <div style="position:absolute;top:14px;left:14px;font-weight:bold">🛵 Ride Go BD</div>
    <div style="position:absolute;top:12px;right:12px;background:white;border-radius:20px;padding:4px 10px;display:flex;gap:4px"><span>🌐</span><select style="border:none;font-weight:bold;font-size:12px;color:#0f3d26"><option>বাংলা</option><option>EN</option><option>हिन्दी</option><option>العربية</option></select></div>
    <div style="font-size:28px;font-weight:900;margin-top:18px">আপনার যাত্রা,<br>আমাদের দায়িত্ব</div>
  </div>
  <div style="margin:70px 16px;background:white;border-radius:22px;padding:28px 18px;box-shadow:0 10px 25px rgba(0,0,0,0.12)">
    <button class="btn btn-green" style="margin-bottom:12px" onclick="go('reg')">+ নতুন? নিবন্ধন করুন</button>
    <button class="btn btn-white" onclick="go('login')">→ অ্যাকাউন্ট আছে? লগইন করুন</button>
  </div>
</div>

<!-- 2. নিবন্ধন -->
<div id="reg" class="page"><div class="box"><h2 style="text-align:center;color:#0f3d26;margin:24px 0">নিবন্ধন করুন</h2><input placeholder="আপনার নাম"><input placeholder="ফোন নাম্বার"><input placeholder="স্পন্সর নাম্বার"><button class="btn btn-green" style="margin-top:12px" onclick="go('otp')">নিবন্ধন করুন</button><button class="btn btn-white" style="margin-top:8px" onclick="go('landing')">পিছনে</button></div></div>

<!-- 3. লগইন -->
<div id="login" class="page"><div class="box"><h2 style="text-align:center;color:#0f3d26;margin:24px 0">লগইন করুন</h2><input placeholder="ফোন নাম্বার"><div style="font-size:11px;color:#666;text-align:center;margin:8px 0">শুধু ফোন নাম্বার দিয়ে লগইন</div><button class="btn btn-green" style="margin-top:12px" onclick="go('otp')">লগইন করুন</button><button class="btn btn-white" style="margin-top:8px" onclick="go('landing')">পিছনে</button></div></div>

<!-- 4. ওটিপি -->
<div id="otp" class="page"><div class="box"><h2 style="text-align:center;color:#0f3d26;margin:24px 0">ওটিপি যাচাই করুন</h2><input placeholder="4 সংখ্যার কোড" style="text-align:center;letter-spacing:8px;font-weight:bold;font-size:18px"><button class="btn btn-green" style="margin-top:12px" onclick="go('home')">যাচাই করুন ও হোমে যান</button></div></div>

<!-- 5. ফাইনাল হোম - ফুল পেজ, যাত্রী/চালক একই ডিজাইন -->
<div id="home" class="page">
  <div style="background:#0f3d26;color:white;padding:18px 16px;display:flex;justify-content:space-between;align-items:center">
    <div style="font-weight:900;font-size:18px">📍🛵 Ride Go BD</div>
    <div style="background:white;border-radius:22px;padding:6px 12px;display:flex;align-items:center;gap:6px"><span>🌐</span><select style="border:none;outline:none;font-weight:bold;font-size:12px;color:#0f3d26;background:transparent"><option>বাংলা</option><option>English</option><option>हिन्दी</option><option>العربية</option><option>اردو</option><option>中文</option></select></div>
  </div>
  <div style="flex:1;padding:22px 16px;display:flex;flex-direction:column">
    <h2 style="font-size:22px;line-height:1.4">স্বাগতম! আপনি কি হিসেবে<br>যাত্রা করবেন?</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px;flex:1">
      <div style="background:#0f3d26;color:white;border-radius:22px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 12px 24px rgba(15,61,38,0.25)"><div style="font-size:48px">🧍</div><div style="margin-top:12px;font-size:20px;font-weight:900">যাত্রী</div><div style="font-size:11px;opacity:.8;margin-top:4px">আমি যাত্রী হিসেবে যাব</div></div>
      <div style="background:white;border-radius:22px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #e5e7eb;box-shadow:0 12px 24px rgba(0,0,0,0.08)"><div style="font-size:48px">🏍️</div><div style="margin-top:12px;font-size:20px;font-weight:900">চালক</div><div style="font-size:11px;color:#666;margin-top:4px">আমি চালক হিসেবে যাব</div></div>
    </div>
    <div style="margin-top:auto;padding-top:28px">
      <div style="text-align:center"><button onclick="go('owner')" style="background:#e9eceb;color:#0f3d26;padding:10px 22px;border-radius:24px;font-size:13px;border:1px solid #ddd">🏠 Owner</button></div>
      <button onclick="go('landing')" style="width:100%;margin-top:22px;padding:16px;border-radius:14px;border:1.5px solid #333;background:white;font-weight:bold">↪ Logout</button>
    </div>
  </div>
</div>

<!-- 6. Owner -->
<div id="owner" class="page"><div class="box"><h2 style="text-align:center;margin:24px 0">Owner Panel</h2><p style="text-align:center;color:#666">Owner এর জন্য</p><button class="btn btn-white" style="margin-top:20px" onclick="go('home')">পিছনে</button></div></div>

<script>
function go(id){document.querySelectorAll('.page').forEach(p=>{p.classList.remove('active');p.style.display='none'});let el=document.getElementById(id);el.classList.add('active');el.style.display='flex';window.scrollTo(0,0)}
// প্রথম পেজ দেখানো
go('landing');
</script>
</body>
</html>
