<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans Bengali',sans-serif}
body{background:#eef6ee}
.hdr{background:linear-gradient(135deg,#0a7a2e,#0fb550);color:#fff;padding:16px 20px;display:flex;gap:12px;align-items:center;font-weight:900;position:sticky;top:0;z-index:99;box-shadow:0 4px 20px #0a7a2e40}
.logo{background:#fff;color:#0a7a2e;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer;box-shadow:0 2px 10px #0002}
.page{display:none;min-height:100vh;background:#fff;max-width:480px;margin:auto;box-shadow:0 0 40px #0001}
.page.active{display:block;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.box{padding:22px}
.btn{background:linear-gradient(135deg,#0a7a2e,#0fb550);color:#fff;border:0;padding:18px;border-radius:16px;width:100%;font-weight:800;margin-top:14px;cursor:pointer;font-size:16px;box-shadow:0 6px 18px #0a7a2e40;transition:0.2s}
.btn:active{transform:scale(0.97)}
.btn2{background:#eef7ee;color:#0a7a2e;border:1px solid #cfe9cf;padding:15px;border-radius:16px;width:100%;font-weight:700;margin-top:10px;cursor:pointer}
.card{background:#f8fff8;border:1px solid #d9f0d9;padding:16px;border-radius:16px;margin:12px 0;box-shadow:0 2px 8px #00005}
.driverCard{background:#fff;border:2px solid #0a7a2e;padding:14px;border-radius:16px;margin:10px 0;box-shadow:0 4px 12px #0a7a2e15;transition:0.2s}
.driverCard:hover{transform:translateY(-2px);box-shadow:0 8px 20px #0a7a2e25}
.badge{background:#0a7a2e;color:#fff;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.statBox{background:linear-gradient(135deg,#f8fff8,#eef7ee);border:1px solid #d9f0d9;padding:14px;border-radius:16px;text-align:center;box-shadow:0 2px 6px #00005}
.toggle{width:52px;height:30px;background:#ddd;border-radius:20px;position:relative;cursor:pointer;display:inline-block;transition:0.3s}
.toggle.on{background:#0a7a2e}
.toggleDot{width:24px;height:24px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:0.3s;box-shadow:0 2px 4px #0002}
.toggle.on .toggleDot{left:25px}
input,select{width:100%;padding:16px;border-radius:14px;border:1.5px solid #d0d0d0;margin:10px 0;font-size:16px;transition:0.2s}
input:focus,select:focus{border-color:#0a7a2e;outline:none;box-shadow:0 0 0 3px #0a7a2e20}
.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
</style>
