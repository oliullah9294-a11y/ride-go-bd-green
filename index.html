<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride Go BD - Fixed</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{background:#eee;display:flex;justify-content:center}
.app{width:100%;max-width:420px;background:white;min-height:100vh}
.page{display:none;min-height:100vh;background:#fff;flex-direction:column;border:4px solid #c00000;border-radius:28px;overflow:hidden;position:relative}
.page.active{display:flex}
.page::before{content:'';position:absolute;left:-30px;top:-30px;width:180px;height:180px;background:#c00000;border-radius:50%;z-index:0;opacity:.9}
.page::after{content:'';position:absolute;right:-40px;bottom:100px;width:180px;height:180px;background:#ffeaea;border-radius:50%;z-index:0}
.inner{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:14px}
.header{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px}
.header .g{color:#0f7a2e} .header .r{color:#c00000}
.lang{margin-left:auto;background:white;border:1px solid #ddd;border-radius:20px;padding:3px 8px;font-size:11px}
.hero{width:100%;height:52vh;min-height:320px;border-radius:18px;overflow:hidden;background:#000;position:relative;margin-top:10px}
.hero img{width:100%;height:100%;object-fit:cover}
.hero-pin{position:absolute;left:12px;top:50%;background:white;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.btn-green{width:100%;background:#0f7a2e;color:white;border:none;border-radius:24px;padding:14px;font-weight:700;font-size:15px;cursor:pointer}
.btn-white{width:100%;background:white;border:1.5px solid #0f7a2e;color:#0f7a2e;border-radius:24px;padding:12px;font-weight:700;margin-top:10px;cursor:pointer}
.card-input{display:flex;align-items:center;gap:10px;background:white;border:1px solid #ddd;border-radius:22px;padding:12px 14px;margin:7px 0}
.card-input input{border:none;outline:none;width:100%}
</style>
</head>
<body>
<div class="app">

<!-- H1 FIXED - আর ফাঁকা থাকবে না -->
<div id="H1" class="page active"><div class="inner">
<div class="header"><span>🚗</span><span class="g">Ride Go</span><span class="r">&nbsp;BD</span><span class="lang">🌐 বাংলা ▾</span></div>
<div class="hero"><img src="https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?w=800" alt="driver"><div class="hero-pin">📍</div></div>
<div style="margin-top:16px">
<button class="btn-green" onclick="go('H2')">👤+ নতুন? নিবন্ধন করুন</button>
<button class="btn-white" onclick="go('H3')">→ অ্যাকাউন্ট আছে? লগইন করুন</button>
<div style="text-align:center;font-size:11px;color:#888;margin-top:8px">H1 - Landing</div>
</div>
</div></div>

<!-- H2 -->
<div id="H2" class="page"><div class="inner">
<div class="header"><span>🚗</span><span class="g">Ride Go</span><span class="r">&nbsp;BD</span></div>
<div style="text-align:center"><div style="width:80px;height:80px;background:#c00000;border-radius:50%;margin:12px auto;display:flex;align-items:center;justify-content:center;color:white;font-size:36px">👤+</div></div>
<div class="card-input"><span>👤</span><input placeholder="আপনার নাম"></div>
<div class="card-input"><span>📞</span><input placeholder="ফোন নাম্বার"></div>
<div class="card-input"><span>👥</span><input placeholder="স্পন্সর নাম্বার"></div>
<button class="btn-green" onclick="go('H4')">✓ নিবন্ধন করুন</button>
<button class="btn-white" onclick="go('H1')">← পিছনে</button>
</div></div>

<!-- H3 -->
<div id="H3" class="page"><div class="inner">
<div class="header"><span>🚗</span><span class="g">Ride Go</span><span class="r">&nbsp;BD</span></div>
<div style="text-align:center"><div style="width:80px;height:80px;background:#c00000;border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;color:white;font-size:36px">🔒</div></div>
<div class="card-input"><span>📱</span><input placeholder="ফোন নাম্বার"></div>
<button class="btn-green" onclick="go('H4')">→ লগইন করুন</button>
<button class="btn-white" onclick="go('H1')">← পিছনে</button>
</div></div>

<!-- H4 -->
<div id="H4" class="page"><div class="inner">
<div class="header"><span>🚗</span><span class="g">Ride Go</span><span class="r">&nbsp;BD</span></div>
<div style="text-align:center"><div style="width:80px;height:80px;background:#c00000;border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;color:white;font-size:36px">🛡️</div></div>
<div style="display:flex;gap:10px;justify-content:center"><input style="width:50px;height:50px;text-align:center;border-radius:10px;border:1.5px solid #bbb"><input style="width:50px;height:50px;text-align:center;border-radius:10px;border:1.5px solid #bbb"><input style="width:50px;height:50px;text-align:center;border-radius:10px;border:1.5px solid #bbb"><input style="width:50px;height:50px;text-align:center;border-radius:10px;border:1.5px solid #bbb"></div>
<button class="btn-green" style="margin-top:20px" onclick="go('H5')">✓ যাচাই করুন ও হোমে যান</button>
</div></div>

<!-- H5 -->
<div id="H5" class="page"><div class="inner">
<div class="header"><span>🚗</span><span class="g">Ride Go</span><span class="r">&nbsp;BD</span></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px">
<div style="background:#0f7a2e;color:white;border-radius:18px;padding:20px;text-align:center" onclick="go('P1')"><div style="font-size:36px">👤</div><b>যাত্রী</b></div>
<div style="background:white;border:1px solid #ddd;border-radius:18px;padding:20px;text-align:center" onclick="go('D1')"><div style="font-size:36px">🚗</div><b>চালক</b></div>
</div>
<button class="btn-white" onclick="go('W1')" style="margin-top:20px">🏠 Owner</button>
<button class="btn-white" onclick="go('H1')">→ Logout</button>
</div></div>

<div id="W1" class="page"><div class="inner"><div class="header"><span>Owner</span></div><button class="btn-green" onclick="go('H5')">← Back</button></div></div>
<div id="P1" class="page"><div class="inner"><div class="header"><span>P1</span></div><button class="btn-green" onclick="go('P2')">Next → P2</button><button class="btn-white" onclick="go('H5')">Back</button></div></div>
<div id="P2" class="page"><div class="inner"><div class="header"><span>P2</span></div><button class="btn-green" onclick="go('P3')">Next → P3</button><button class="btn-white" onclick="go('P1')">Back</button></div></div>
<div id="P3" class="page"><div class="inner"><div class="header"><span>P3</span></div><button class="btn-green" onclick="go('H5')">Finish</button><button class="btn-white" onclick="go('P2')">Back</button></div></div>
<div id="D1" class="page"><div class="inner"><div class="header"><span>D1</span></div><button class="btn-green" onclick="go('D2')">Next → D2</button><button class="btn-white" onclick="go('H5')">Back</button></div></div>
<div id="D2" class="page"><div class="inner"><div class="header"><span>D2</span></div><button class="btn-green" onclick="go('H5')">Finish</button><button class="btn-white" onclick="go('D1')">Back</button></div></div>

</div>
<script>function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}</script>
</div>
</body>
</html>
