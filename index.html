<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride Go BD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f0f2f5;min-height:100vh}
.header{background:#16a34a;color:white;padding:60px 20px 115px;position:relative;text-align:center;border-radius:0 0 32px 32px}
.logo{position:absolute;top:14px;left:14px;font-weight:bold;font-size:15px}
.lang{position:absolute;top:12px;right:12px}
.lang select{padding:6px 14px;border-radius:20px;border:none;background:white;color:#16a34a;font-weight:bold}
.title{font-size:28px;font-weight:900;margin-top:18px;line-height:1.3}
.card{margin:70px 16px 20px;background:white;border-radius:22px;padding:28px 18px 22px;box-shadow:0 10px 25px rgba(0,0,0,0.12)}
.btn{width:100%;padding:16px;border-radius:14px;border:none;font-weight:bold;font-size:15px;margin-bottom:16px;cursor:pointer;display:block;text-align:center}
.btn-green{background:#14532d;color:white}
.btn-white{background:#fff;color:#111;border:1px solid #ddd}
.page{display:none}
.page.active{display:block}
.inputBox{padding:22px}
input{width:100%;padding:14px;margin:9px 0;border:1px solid #ddd;border-radius:12px;font-size:14px}
.small{font-size:12px;color:#666;text-align:center;margin-top:8px;margin-bottom:8px}
</style>
</head>
<body>

<div id="home" class="page active">
  <div class="header">
    <div class="logo">🛵 Ride Go BD</div>
    <div class="lang">
      <select id="langSelect">
        <option value="bn">🇧🇩 বাংলা</option>
        <option value="en">🇬🇧 English</option>
      </select>
    </div>
    <div class="title">আপনার যাত্রা,<br>আমাদের দায়িত্ব</div>
  </div>
  <div class="card">
    <div style="height:18px"></div>
    <button class="btn btn-green" onclick="go('reg')">+ নতুন? নিবন্ধন করুন</button>
    <div style="height:6px"></div>
    <button class="btn btn-white" onclick="go('login')">→ অ্যাকাউন্ট আছে? লগইন করুন</button>
    <div style="height:22px"></div>
  </div>
</div>

<div id="reg" class="page">
  <div class="inputBox">
    <h2 style="color:#14532d;text-align:center;margin:20px 0 16px">নিবন্ধন করুন</h2>
    <input placeholder="আপনার নাম">
    <input placeholder="ফোন নাম্বার">
    <input placeholder="স্পন্সর নাম্বার">
    <div class="small">✓ কোনো পাসওয়ার্ড লাগবে না</div>
    <button class="btn btn-green" style="margin-top:18px">নিবন্ধন করুন</button>
    <button class="btn btn-white" onclick="go('home')">পিছনে</button>
  </div>
</div>

<div id="login" class="page">
  <div class="inputBox">
    <h2 style="color:#14532d;text-align:center;margin:20px 0 16px">লগইন করুন</h2>
    <input placeholder="ফোন নাম্বার">
    <div class="small">শুধু ফোন নাম্বার দিয়ে লগইন - পাসওয়ার্ড লাগবে না</div>
    <button class="btn btn-green" style="margin-top:18px">লগইন করুন</button>
    <button class="btn btn-white" onclick="go('home')">পিছনে</button>
  </div>
</div>

<script>
function go(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
</script>
</body>
</html>
