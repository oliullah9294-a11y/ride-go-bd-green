<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride Go BD Green</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family: 'Hind Siliguri', sans-serif;}</style>
</head>
<body class="bg-gray-50">

<!-- H2 নিবন্ধন পেজ (শুরুতে) -->
<div id="h2-page" class="min-h-screen p-6 hidden">
  <div class="max-w-sm mx-auto bg-white p-6 rounded-2xl shadow-lg mt-10">
    <h2 class="text-2xl font-bold text-center text-green-600">H2 নিবন্ধন</h2>
    <p class="text-center text-sm text-gray-500 mb-6">Ride Go BD Green</p>
    <form onsubmit="handleRegister(event)" class="space-y-4">
      <input id="name" type="text" placeholder="আপনার নাম" required class="w-full p-3 border rounded-xl">
      <input id="mobile" type="tel" placeholder="মোবাইল 01XXXXXXXXX" required maxlength="11" class="w-full p-3 border rounded-xl">
      <input id="sponsor" type="text" placeholder="স্পন্সর কোড (যদি থাকে)" class="w-full p-3 border rounded-xl">
      <button type="submit" class="w-full bg-green-600 text-white p-3 rounded-xl font-bold">রেজিস্ট্রেশন →</button>
    </form>
  </div>
</div>

<!-- H5 পেজ (মেইন গেট - রেজিস্ট্রেশনের পর) -->
<div id="h5-page" class="min-h-screen p-6 hidden">
  <div class="max-w-sm mx-auto text-center mt-10">
    <h1 class="text-3xl font-bold text-green-600">RG Ride Go</h1>
    <p class="text-gray-600 mb-8">আপনি কিভাবে এগোতে চান?</p>
    <div class="space-y-4">
      <button onclick="showPage('passenger-page')" class="w-full bg-green-600 text-white p-4 rounded-2xl font-bold text-lg shadow">🧍 আমি যাত্রী</button>
      <button onclick="showPage('driver-page')" class="w-full bg-white border-2 border-green-600 text-green-600 p-4 rounded-2xl font-bold text-lg">🚗 আমি চালক</button>
      <button onclick="logout()" class="text-sm text-gray-400 mt-6">লগআউট করুন</button>
    </div>
  </div>
</div>

<!-- যাত্রী পেজ -->
<div id="passenger-page" class="min-h-screen p-6 hidden">
  <div class="max-w-sm mx-auto">
    <button onclick="showPage('h5-page')" class="text-green-600 mb-4">← ফিরে যান</button>
    <h2 class="text-2xl font-bold">যাত্রী ড্যাশবোর্ড</h2>
    <p class="text-gray-500">এখানে রাইড বুক করবেন। (এই পেজটা পরে ডিজাইন করবো)</p>
    <div class="bg-white p-4 rounded-xl mt-4 shadow">📍 কোথা থেকে যাবেন?</div>
  </div>
</div>

<!-- চালক প্রোফাইল পেজ (উপ-পৃষ্ঠা) -->
<div id="driver-page" class="min-h-screen p-6 hidden">
  <div class="max-w-sm mx-auto">
    <button onclick="showPage('h5-page')" class="text-green-600 mb-4">← ফিরে যান</button>
    <div class="bg-white rounded-2xl shadow-lg p-6 text-center">
      <div class="w-20 h-20 bg-green-100 rounded-full mx-auto flex items-center justify-center text-3xl">👨‍✈️</div>
      <h2 id="driver-name" class="text-xl font-bold mt-3">চালকের নাম</h2>
      <p id="driver-mobile" class="text-gray-500">01XXXXXXXXX</p>
      <div class="grid grid-cols-2 gap-3 mt-6 text-left">
        <div class="bg-gray-50 p-3 rounded-xl"><p class="text-xs text-gray-400">আজকের আয়</p><p class="font-bold">৳ 1,250</p></div>
        <div class="bg-gray-50 p-3 rounded-xl"><p class="text-xs text-gray-400">রেটিং</p><p class="font-bold">⭐ 4.8</p></div>
        <div class="bg-gray-50 p-3 rounded-xl"><p class="text-xs text-gray-400">গাড়ি</p><p class="font-bold">Bike - ঢাকা মেট্রো</p></div>
        <div class="bg-gray-50 p-3 rounded-xl"><p class="text-xs text-gray-400">স্পন্সর</p><p id="driver-sponsor" class="font-bold">N/A</p></div>
      </div>
      <button class="w-full bg-green-600 text-white p-3 rounded-xl mt-6">অনলাইন হন</button>
    </div>
  </div>
</div>

<script>
// পেজ ম্যানেজমেন্ট
function showPage(id){
  document.querySelectorAll('[id$="-page"]').forEach(p=>p.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function handleRegister(e){
  e.preventDefault();
  const user = {
    name: document.getElementById('name').value,
    mobile: document.getElementById('mobile').value,
    sponsor: document.getElementById('sponsor').value || 'N/A'
  };
  if(user.mobile.length != 11){ alert('১১ ডিজিটের মোবাইল দিন'); return; }
  localStorage.setItem('ridego_user', JSON.stringify(user));
  alert('রেজিস্ট্রেশন সফল!');
  loadApp();
}

function loadApp(){
  const user = JSON.parse(localStorage.getItem('ridego_user') || 'null');
  if(!user){
    showPage('h2-page'); // ইউজার নেই = H2 দেখাও
  } else {
    // ইউজার আছে = H5 দেখাও
    showPage('h5-page');
    document.getElementById('driver-name').innerText = user.name;
    document.getElementById('driver-mobile').innerText = user.mobile;
    document.getElementById('driver-sponsor').innerText = user.sponsor;
  }
}

function logout(){
  if(confirm('আপনি কি লগআউট করতে চান? তাহলে আবার রেজিস্ট্রেশন করতে হবে।')){
    localStorage.removeItem('ridego_user');
    loadApp();
  }
}

// অ্যাপ চালু হওয়ার সময় চেক
loadApp();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
