<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ride Go BD</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}.h{background:#0a7a2e;color:#fff;padding:14px;font-weight:900;position:sticky;top:0}.p{display:none;min-height:100vh;max-width:480px;margin:auto;background:#fff}.p.a{display:block}.b{padding:20px}.btn{background:#0a7a2e;color:#fff;border:0;padding:16px;border-radius:12px;width:100%;font-weight:800;margin-top:10px}.btn2{background:#eef7ee;color:#0a7a2e;border:1px solid #cfe9cf;padding:14px;border-radius:12px;width:100%;font-weight:700;margin-top:8px}input,select{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;margin:6px 0}.c{background:#f8fff8;border:1px solid #d9f0d9;padding:12px;border-radius:10px;margin:8px 0}</style></head><body>
<div id="H1" class="p a"><div class="h">Ride Go BD Green</div><div class="b" style="text-align:center"><h2 style="color:#0a7a2e;margin-top:30px">Ride Go BD Green</h2><p>Safe Ride</p><button class="btn" onclick="go('H2')">শুরু করুন →</button></div></div>
<div id="H2" class="p"><div class="h">H2 নিবন্ধন - ১বার করলেই হবে</div><div class="b"><input id="n" placeholder="নাম *বাধ্যতামূলক"><input id="p" placeholder="মোবাইল 01XXXXXXXXX *বাধ্যতামূলক"><button class="btn" onclick="reg()">রেজিস্ট্রেশন → H5</button></div></div>
<div id="H5" class="p"><div class="h">H5 শাখা - <span id="u"></span></div><div class="b"><div class="btn" style="text-align:center" onclick="go('P1')">🧍 যাত্রী</div><div class="btn2" style="text-align:center" onclick="go('DP')">🏍️ চালক প্রোফাইল (ঐচ্ছিক) →</div><button class="btn2" onclick="logout()">লগআউট</button></div></div>
<div id="DP" class="p"><div class="h">চালক প্রোফাইল - সব ঐচ্ছিক</div><div class="b"><div id="pt" style="background:#eef7ee;padding:8px;border-radius:8px;font-size:12px;text-align:center">প্রোফাইল 0% সম্পূর্ণ (ঐচ্ছিক)</div><input id="dn" placeholder="নাম (ঐচ্ছিক)" oninput="pr()"><input id="dv" placeholder="গাড়ি নাম্বার (ঐচ্ছিক)" oninput="pr()"><input id="df" placeholder="ফিটনেস নম্বর (ঐচ্ছিক)" oninput="pr()"><select id="dt" onchange="pr()"><option value="">গাড়ির ধরন (ঐচ্ছিক)</option><option>Bike</option><option>CNG</option><option>Car</option></select><input id="dl" placeholder="লাইসেন্স (ঐচ্ছিক)" oninput="pr()"><button class="btn" onclick="save()">সেভ (ঐচ্ছিক)</button><button class="btn2" onclick="go('D1')">Skip → D1</button><button class="btn2" onclick="go('H5')">Back H5</button></div></div>
<div id="P1" class="p"><div class="h">P1 যাত্রী</div><div class="b">P1 OK <button class="btn2" onclick="go('H5')">Back H5</button></div></div>
<div id="D1" class="p"><div class="h">D1 চালক</div><div class="b"><div class="c">গাড়ি: <b id="vs">ঐচ্ছিক</b> | ফিটনেস: <b id="fs">ঐচ্ছিক</b></div><button class="btn2" onclick="go('H5')">Back H5</button></div></div>
<script>
function go(id){document.querySelectorAll('.p').forEach(e=>e.classList.remove('a'));document.getElementById(id).classList.add('a');if(id==='H5')document.getElementById('u').innerText=localStorage.getItem('ph')||'';if(id==='D1'){let d=JSON.parse(localStorage.getItem('dp')||'{}');document.getElementById('vs').innerText=d.v||'ঐচ্ছিক';document.getElementById('fs').innerText=d.f||'ঐচ্ছিক';}}
function reg(){let n=document.getElementById('n').value.trim();let p=document.getElementById('p').value.trim();if(!n||p.length<11){alert('নাম ও ১১ ডিজিট মোবাইল বাধ্যতামূলক');return;}localStorage.setItem('nm',n);localStorage.setItem('ph',p);localStorage.setItem('ok','1');go('H5');}
function check(){if(localStorage.getItem('ok'))go('H5');else go('H1');}
function logout(){localStorage.clear();go('H1');}
function save(){let d={n:document.getElementById('dn').value,v:document.getElementById('dv').value,f:document.getElementById('df').value,t:document.getElementById('dt').value,l:document.getElementById('dl').value};localStorage.setItem('dp',JSON.stringify(d));go('D1');}
function pr(){let c=0;if(dn.value)c++;if(dv.value)c++;if(df.value)c++;if(dt.value)c++;if(dl.value)c++;let per=Math.round(c/5*100);document.getElementById('pt').innerText='প্রোফাইল '+per+'% সম্পূর্ণ — সম্পূর্ণ করুন (ঐচ্ছিক)';}
check();
</script></body></html>
