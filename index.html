<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride Go BD - Green Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{background:#f1f8f1;display:flex;justify-content:center}
.phone{width:100%;max-width:400px;background:#fff;min-height:100vh;position:relative}
.top{height:55vh;background:linear-gradient(180deg,#158a43 0%,#0f6d33 100%);border-radius:0 0 45px 45px;padding:18px 18px;position:relative;overflow:hidden}
.nav{display:flex;justify-content:space-between;color:#fff;align-items:center}
.logo{font-weight:700;font-size:20px}
.lang{border:1.5px solid rgba(255,255,255,.6);padding:5px 12px;border-radius:20px;font-size:12px}
.top h1{color:#fff;text-align:center;margin-top:35px;font-size:26px;line-height:1.2}
.top p{color:rgba(255,255,255,.9);text-align:center;font-size:14px;margin-top:8px}
.leaf{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:70px;opacity:.25}
.card{margin:-110px 18px 20px 18px;background:#fff;border-radius:32px;padding:28px 18px;box-shadow:0 15px 35px rgba(0,0,0,.12);position:relative;z-index:5;text-align:center}
.card h2{font-size:23px}
.card .sub{color:#777;margin:4px 0 22px 0;font-size:14px}
.btn-g{display:flex;align-items:center;gap:14px;background:#0f8a43;color:#fff;border:none;width:100%;padding:14px 16px;border-radius:16px;font-size:16px;font-weight:600;text-align:left}
.btn-g .ic{width:46px;height:46px;background:#fff;color:#0f8a43;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.btn-w{display:flex;align-items:center;gap:14px;background:#fff;color:#111;border:2px solid #e8f5e9;width:100%;padding:14px 16px;border-radius:16px;font-size:16px;font-weight:600;text-align:left;margin-top:14px}
.btn-w .ic{width:46px;height:46px;background:#e8f5e9;color:#0f8a43;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
</style>
</head>
<body>
<div class="phone">
<div class="top">
<div class="nav"><div class="logo">🛵 Ride Go BD</div><div class="lang">🌐 বাংলা | English</div></div>
<h1>আপনার যাত্রা,<br>আমাদের দায়িত্ব</h1>
<p>নিরাপদ ও নির্ভরযোগ্য রাইড শেয়ারিং</p>
<div class="leaf">🌿 🌿 🌿</div>
</div>
<div class="card">
<h2>Ride Go BD তে স্বাগতম</h2>
<div class="sub">আপনার যাত্রা শুরু করুন</div>
<button class="btn-g"><div class="ic">👤+</div><div>নতুন? নিবন্ধন করুন<br><small style="font-weight:400;font-size:12px;opacity:.9">নতুন অ্যাকাউন্ট তৈরি করুন</small></div></button>
<button class="btn-w"><div class="ic">→</div><div>অ্যাকাউন্ট আছে?<br><b style="color:#0f8a43">লগইন করুন</b><br><small style="font-weight:400;color:#777;font-size:12px">ফোন নম্বর দিয়ে ওটিপি লগইন</small></div></button>
</div>
</div>
</body>
</html>
