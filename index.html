<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride Go BD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f0f2f5}
.header{background:#16a34a;color:white;padding:55px 20px 85px;position:relative;text-align:center;border-radius:0 0 28px 28px}
.logo{position:absolute;top:14px;left:14px;font-weight:bold}
.lang{position:absolute;top:12px;right:12px}
.lang select{padding:6px 14px;border-radius:20px;border:none;background:white;color:#16a34a;font-weight:bold}
.title{font-size:27px;font-weight:900;margin-top:10px}
.card{margin:22px 16px 20px;background:white;border-radius:20px;padding:18px;box-shadow:0 8px 20px rgba(0,0,0,0.12)}
.btn{width:100%;padding:15px;border-radius:14px;border:none;font-weight:bold;font-size:15px;margin-bottom:12px;cursor:pointer;display:block;text-align:center}
.btn-green{background:#14532d;color:white;margin-top:4px}
.btn-white{background:#fff;color:#111;border:1px solid #ddd}
.page{display:none}
.page.active{display:block}
.inputBox{padding:20px}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:12px}
.small{font-size:12px;color:#666;text-align:center;margin-top:10px}
</style>
</head>
<body>

<div id="home" class="page active">
  <div class="header">
    <div class="logo">🛵 Ride Go BD</div>
    <div class="lang">
      <select id="langSelect" onchange="changeLang(this.value)">
        <option value="bn">🇧🇩 বাংলা</option>
        <option value="en">🇬🇧 English</option>
      </select>
    </div>
    <div class="title" id="t1">আপনার যাত্রা,<br>আমাদের দায়িত্ব</div>
  </div>
  <div class="card">
    <button class="btn btn-green" id="b1" onclick="go('reg')">+ নতুন? নিবন্ধন করুন</button>
    <button class="btn btn-white" id="b2" onclick="go('login')">→ অ্যাকাউন্ট আছে? লগইন করুন</button>
  </div>
</div>

<div id="reg" class="page">
  <div class="inputBox">
    <h2 id="rTitle" style="color:#14532d;text-align:center;margin:20px 0">নিবন্ধন করুন</h2>
    <input placeholder="আপনার নাম">
    <input placeholder="ফোন নাম্বার">
    <input placeholder="স্পন্সর নাম্বার">
    <div class="small">✓ কোনো পাসওয়ার্ড লাগবে না</div>
    <button class="btn btn-green" style="margin-top:10px">নিবন্ধন করুন</button>
    <button class="btn btn-white" onclick="go('home')">পিছনে</button>
  </div>
</div>

<div id="login" class="page">
  <div class="inputBox">
    <h2 style="color:#14532d;text-align:center;margin:20px 0">লগইন করুন</h2>
    <input placeholder="ফোন নাম্বার">
    <div class="small">শুধু ফোন নাম্বার দিয়ে লগইন</div>
    <button class="btn btn-green" style="margin-top:10px">লগইন করুন</button>
    <button class="btn btn-white" onclick="go('home')">পিছনে</button>
  </div>
</div>

<script>
function go(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function changeLang(v){
  localStorage.setItem('lg',v);
  let t=document.getElementById('t1');
  if(v=='en'){t.innerHTML="Your Journey,<br>Our Responsibility";document.getElementById('b1').innerText="+ New? Register";document.getElementById('b2').innerText="→ Have account? Login";}
  else{t.innerHTML="আপনার যাত্রা,<br>আমাদের দায়িত্ব";document.getElementById('b1').innerText="+ নতুন? নিবন্ধন করুন";document.getElementById('b2').innerText="→ অ্যাকাউন্ট আছে? লগইন করুন";}
}
</script>
</body>
</html>
